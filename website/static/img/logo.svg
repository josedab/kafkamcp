<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Kafka-inspired streaming lines meeting MCP connector -->
  <defs>
    <linearGradient id="kafkaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e04e39;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f06449;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#kafkaGrad)" />
  <!-- Kafka "K" stylized as streaming data -->
  <g fill="white">
    <!-- Vertical bar -->
    <rect x="32" y="28" width="10" height="64" rx="3" />
    <!-- Upper diagonal (stream out) -->
    <rect x="42" y="28" width="40" height="10" rx="3" transform="rotate(30, 42, 33)" />
    <!-- Lower diagonal (stream in) -->
    <rect x="42" y="82" width="40" height="10" rx="3" transform="rotate(-30, 42, 87)" />
    <!-- MCP connector dots -->
    <circle cx="82" cy="38" r="7" />
    <circle cx="82" cy="60" r="7" />
    <circle cx="82" cy="82" r="7" />
    <!-- Connection lines to dots -->
    <rect x="56" y="57" width="20" height="6" rx="2" />
  </g>
</svg>
