[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kafkamcp-langchain"
version = "0.1.0"
description = "LangChain integration for KafkaMCP — use Kafka as AI agent tools"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.2.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/kafkamcp/kafkamcp"
Repository = "https://github.com/kafkamcp/kafkamcp/tree/main/sdk/python/kafkamcp_langchain"

[tool.setuptools.packages.find]
include = ["kafkamcp_langchain*"]
