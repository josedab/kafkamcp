name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # Required for keyless Sigstore signing and GitHub artifact attestations.
  id-token: write
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA-compatible build provenance for the released binaries. This is
      # independent of the cosign signatures produced by GoReleaser and does not
      # require any long-lived keys.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Resolve container manifest digest
        id: container
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/josedab/kafkamcp:${version}"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)"
          test -n "$digest" && test "$digest" != "null"
          echo "name=ghcr.io/josedab/kafkamcp" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest container provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.container.outputs.name }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
