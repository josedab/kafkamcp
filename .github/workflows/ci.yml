name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Check tool docs are up to date
        run: |
          go run ./cmd/gen-tool-docs
          git diff --exit-code docs/tool-reference.md website/docs/api-reference/tools.md

      - name: Check website tool count matches generated docs
        run: |
          gen_count=$(grep -oP '^\*\*\d+ tools\*\*' docs/tool-reference.md | grep -oP '\d+')
          web_count=$(grep -oP 'exposes \d+ MCP tools' website/docs/api-reference/tools.md | grep -oP '\d+')
          if [ "$gen_count" != "$web_count" ]; then
            echo "ERROR: tool count mismatch — docs/tool-reference.md has $gen_count tools, website/docs/api-reference/tools.md has $web_count tools"
            echo "Update the tool count in website/docs/api-reference/tools.md to match."
            exit 1
          fi
          echo "Tool counts match: $gen_count"

      - name: Test
        run: make test

      - name: Check coverage threshold
        run: make test-coverage-check MIN_COVERAGE=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linter
        run: make lint

  gosec:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run production gosec gate
        run: make security-static GOSEC_REPORT=gosec-results.json

      - name: Upload gosec results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gosec-results
          path: gosec-results.json

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: make helm-check

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o bin/kafkamcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/kafkamcp

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: kafkamcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/kafkamcp-*

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    services:
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: make integration-test
        env:
          KAFKA_BROKERS: localhost:9092

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=5 -run=^$ ./internal/kafka/ | tee benchmark-results.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d

      - name: Download baseline benchmarks
        uses: actions/cache@v5
        with:
          path: benchmark-baseline.txt
          key: benchmark-baseline-${{ github.base_ref || 'main' }}
          restore-keys: |
            benchmark-baseline-main

      - name: Compare benchmarks
        run: |
          if [ -f benchmark-baseline.txt ]; then
            echo "## Benchmark Comparison" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            benchstat benchmark-baseline.txt benchmark-results.txt >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No baseline benchmarks found — saving current run as baseline."
          fi
          cp benchmark-results.txt benchmark-baseline.txt

      - name: Save baseline benchmarks
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: benchmark-baseline.txt
          key: benchmark-baseline-main

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: benchmark-results.txt

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary for SBOM
        run: go build -o bin/kafkamcp ./cmd/kafkamcp

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: kafkamcp-sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.spdx.json
