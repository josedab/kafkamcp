name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Configure kafkamcp.yaml with ...
        2. Run `kafkamcp --config kafkamcp.yaml`
        3. Connect an MCP agent and call ...
        4. See error ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KafkaMCP Version
      description: Output of `kafkamcp version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - sse
        - streamable-http
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant parts of your kafkamcp.yaml (redact secrets).
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (set `log_level: debug` for more detail).
      render: text

  - type: input
    id: os
    attributes:
      label: OS / Environment
      placeholder: "macOS 14, Docker, Linux amd64"
