project_name: kafkamcp

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: kafkamcp
    main: ./cmd/kafkamcp
    binary: kafkamcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

dockers:
  - image_templates:
      - "ghcr.io/kafkamcp/kafkamcp:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    dockerfile: Dockerfile
    goarch: amd64

  - image_templates:
      - "ghcr.io/kafkamcp/kafkamcp:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    dockerfile: Dockerfile
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/kafkamcp/kafkamcp:{{ .Version }}"
    image_templates:
      - "ghcr.io/kafkamcp/kafkamcp:{{ .Version }}-amd64"
      - "ghcr.io/kafkamcp/kafkamcp:{{ .Version }}-arm64"
  - name_template: "ghcr.io/kafkamcp/kafkamcp:latest"
    image_templates:
      - "ghcr.io/kafkamcp/kafkamcp:{{ .Version }}-amd64"
      - "ghcr.io/kafkamcp/kafkamcp:{{ .Version }}-arm64"
