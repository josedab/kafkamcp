# yaml-language-server: $schema=docs/kafkamcp.schema.json
# KafkaMCP Server Configuration
server:
  transport: stdio          # stdio | sse | streamable-http
  host: 0.0.0.0             # For SSE/HTTP transports
  port: 3100                # For SSE/HTTP transports
  log_level: info           # debug | info | warn | error

  # Optional: persist engine state (materialised views today, more
  # engines being migrated incrementally — see docs/PERSISTENCE.md).
  # When omitted, KafkaMCP runs entirely in-memory and state is lost
  # on restart.
  # persistence:
  #   backend: sqlite                       # "inmem" (default) or "sqlite"
  #   path: /var/lib/kafkamcp/state.db      # required when backend=sqlite

clusters:
  - name: local
    bootstrap_servers: "localhost:9092"
    security_protocol: PLAINTEXT
    default: true

    # Optional: Schema Registry
    # schema_registry:
    #   url: "http://localhost:8081"
    #   auth:
    #     username: "${SR_USERNAME}"
    #     password: "${SR_PASSWORD}"

    # Optional: Kafka Connect
    # connect_url: "http://localhost:8083"
    # connect_tls:
    #   ca_file: "/path/to/connect-ca.pem"
    #   insecure_skip_verify: false

# Schema Cache Configuration
schema_cache:
  max_entries: 10000
  ttl_seconds: 300

