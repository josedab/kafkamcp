version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentedOutCode
        - ifElseChain
        - appendCombine
        - sprintfQuotedString
      enabled-tags:
        - diagnostic
        - performance
    misspell:
      locale: US
    staticcheck:
      # Preserve parity with the previous golangci-lint v1 default staticcheck
      # scope: the "quickfix" (QF*) and "stylecheck" (ST*) groups were not run
      # by the v1 default and are stylistic-only, so they are disabled here.
      checks:
        - all
        - -QF*
        - -ST*
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
          severity: warning
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/josedab/kafkamcp
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
