run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - misspell
    - unconvert
    - gocritic

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - hugeParam
  misspell:
    locale: US
  goimports:
    local-prefixes: github.com/kafkamcp/kafkamcp

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 5
