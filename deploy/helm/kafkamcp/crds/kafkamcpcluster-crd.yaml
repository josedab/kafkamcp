apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkamcpclusters.kafkamcp.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: kafkamcp.io
  names:
    kind: KafkaMCPCluster
    listKind: KafkaMCPClusterList
    plural: kafkamcpclusters
    singular: kafkamcpcluster
    shortNames:
      - kmcp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: KafkaMCPCluster represents a KafkaMCP deployment connected to a Kafka cluster.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: KafkaMCPClusterSpec defines the desired state of KafkaMCPCluster.
              type: object
              required:
                - bootstrapServers
              properties:
                bootstrapServers:
                  description: Comma-separated Kafka broker addresses.
                  type: string
                securityProtocol:
                  description: "Security protocol: PLAINTEXT, SSL, SASL_SSL, SASL_PLAINTEXT."
                  type: string
                  enum:
                    - PLAINTEXT
                    - SSL
                    - SASL_SSL
                    - SASL_PLAINTEXT
                  default: PLAINTEXT
                saslMechanism:
                  description: "SASL mechanism: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512."
                  type: string
                  enum:
                    - PLAIN
                    - SCRAM-SHA-256
                    - SCRAM-SHA-512
                credentialsSecret:
                  description: Name of a Secret containing SASL credentials (keys SASL_USERNAME, SASL_PASSWORD).
                  type: string
                schemaRegistryURL:
                  description: URL of the Confluent Schema Registry.
                  type: string
                replicas:
                  description: Number of KafkaMCP replicas.
                  type: integer
                  minimum: 1
                  default: 1
                autoscaling:
                  description: Horizontal pod autoscaling configuration.
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    minReplicas:
                      type: integer
                      minimum: 1
                      default: 1
                    maxReplicas:
                      type: integer
                      minimum: 1
                      default: 10
                    targetCPUUtilizationPercentage:
                      type: integer
                      default: 80
                    targetMemoryUtilizationPercentage:
                      type: integer
                      default: 80
                image:
                  description: Container image configuration.
                  type: object
                  properties:
                    repository:
                      type: string
                      default: "ghcr.io/kafkamcp/kafkamcp"
                    tag:
                      type: string
                    pullPolicy:
                      type: string
                      enum: [Always, IfNotPresent, Never]
                      default: IfNotPresent
                resources:
                  description: Resource requests and limits.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                configHash:
                  description: Hash of the desired configuration for change detection.
                  type: string
                updateStrategy:
                  description: Rolling update strategy.
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [RollingUpdate, Recreate]
                      default: RollingUpdate
                    maxUnavailable:
                      type: integer
                      default: 0
                    maxSurge:
                      type: integer
                      default: 1
                transport:
                  description: "MCP transport: sse, streamable-http."
                  type: string
                  enum:
                    - sse
                    - streamable-http
                  default: streamable-http
                policies:
                  description: Access control policies.
                  type: object
                  properties:
                    defaultDeny:
                      type: boolean
                      default: false
                  x-kubernetes-preserve-unknown-fields: true
                masking:
                  description: Data masking configuration.
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                  x-kubernetes-preserve-unknown-fields: true
            status:
              description: KafkaMCPClusterStatus defines the observed state.
              type: object
              properties:
                phase:
                  description: "Current phase: Pending, Running, Error."
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                connectedBrokers:
                  description: Number of connected Kafka brokers.
                  type: integer
                topicCount:
                  description: Number of discovered topics.
                  type: integer
                readyReplicas:
                  description: Number of ready replicas.
                  type: integer
                currentConfigHash:
                  description: Hash of the currently applied configuration.
                  type: string
                lastReconcileTime:
                  description: Time of the last successful reconciliation.
                  type: string
                  format: date-time
                observedGeneration:
                  description: Most recent generation observed by the controller.
                  type: integer
                  format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Bootstrap
          type: string
          jsonPath: .spec.bootstrapServers
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
