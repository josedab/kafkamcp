# Default values for KafkaMCP Helm chart

# KafkaMCP is single-replica whenever SQLite persistence or guarded tool packs
# are enabled. The chart rejects unsafe multi-replica/autoscaling combinations.
replicaCount: 1

image:
  # Container image registry and repository
  repository: ghcr.io/josedab/kafkamcp
  # Image pull policy: IfNotPresent avoids re-pulling on every restart
  pullPolicy: IfNotPresent
  # Image tag override; defaults to the chart's appVersion when empty
  tag: ""  # Defaults to appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# KafkaMCP configuration
config:
  server:
    transport: "streamable-http"
    host: "0.0.0.0"
    port: 3100
    metrics_host: "0.0.0.0"
    metrics_port: 3101
    log_level: "info"
    tool_packs:
      - "core-read"
  clusters:
    - name: default
      bootstrap_servers: "REPLACE_ME:9093"
      security_protocol: "SASL_SSL"
      sasl_mechanism: "SCRAM-SHA-512"
      sasl_username: "${KAFKA_SASL_USERNAME}"
      sasl_password: "${KAFKA_SASL_PASSWORD}"
      tls_min_version: "1.2"
  schema_cache:
    max_entries: 10000
    ttl_seconds: 300
  audit:
    enabled: true
    max_entries: 10000
  masking:
    enabled: false
    rules: []
  telemetry:
    enabled: false
    endpoint: ""           # OTLP collector endpoint (e.g., "otel-collector:4317")
    insecure: false
    service_name: "kafkamcp"
    sample_rate: 1.0
  policies:
    default_deny: true
    identity:
      provider: "static"
      allow_header_fallback: false
      static:
        tokens:
          - token: "${KAFKAMCP_AGENT_TOKEN}"
            agent_id: "helm-agent"
    agents:
      - id: "helm-agent"
        role: "admin"
        topics:
          - pattern: "*"
            permissions: ["read"]
        consumer_groups:
          permissions: ["read", "describe"]
        schemas:
          permissions: ["read"]

# Existing secret for Kafka credentials (optional).
# When set, the chart mounts this Secret instead of creating one.
# Must contain KAFKAMCP_AGENT_TOKEN. Add KAFKAMCP_APPROVAL_SIGNING_KEY when
# enabling ops-write, plus any Kafka / Schema Registry credential variables
# referenced by config.
existingSecret: ""

# Create a chart-managed Secret with the values below.
# Ignored if existingSecret is set — existingSecret always takes precedence.
secrets:
  create: true
  # Leave empty to generate and preserve a random 48-character bearer token.
  # Retrieve it with:
  # kubectl get secret <release>-kafkamcp-credentials -o jsonpath='{.data.KAFKAMCP_AGENT_TOKEN}' | base64 -d
  agentToken: ""
  kafkaSaslUsername: ""
  kafkaSaslPassword: ""
  schemaRegistryUsername: ""
  schemaRegistryPassword: ""
  # Required when enabling the ops-write tool pack.
  approvalSigningKey: ""
  extra: {}  # Additional key-value pairs injected into the Secret

service:
  type: ClusterIP
  port: 3100
  metricsPort: 3101
  annotations: {}
  # ClientIP is optional for read-only volatile sessions. It does not make
  # guarded writes safe across replicas; those are enforced as singleton.
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

ingress:
  enabled: false
  className: ""
  annotations: {}
  stickySessions:
    enabled: false
    cookieName: "kafkamcp"
    cookieMaxAge: "10800"
  hosts:
    - host: kafkamcp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Pod resource requests and limits.
# Requests are used by the scheduler; limits cap actual usage.
# Tune based on cluster size and expected concurrent agent connections.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Durable single-node state. When enabled, the chart injects
# server.persistence.backend=sqlite and mounts a ReadWriteOnce PVC.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /var/lib/kafkamcp
  filename: state.db
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
terminationGracePeriodSeconds: 30
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  namespace: ""

# NetworkPolicy
networkPolicy:
  enabled: true
  # Empty means any source selected by the NetworkPolicy. Restrict these in
  # production to your ingress/gateway and monitoring namespaces.
  ingressFrom: []
  metricsIngressFrom: []
  kafkaCIDR: ""      # CIDR for Kafka broker egress (e.g., "10.0.0.0/8")
  telemetry:
    enabled: false
    ports:
      - 4317
      - 4318
    cidr: ""
  additionalEgress: []

# Rolling update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Startup, liveness, and readiness probes. Liveness is process-local; Kafka
# outages only remove the pod from service through readiness.
startupProbe:
  httpGet:
    path: /livez
    port: metrics
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /livez
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /ready
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
