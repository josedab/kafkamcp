{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafkamcp.fullname" . }}
  labels:
    {{- include "kafkamcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kafkamcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.config.server.port }}
          protocol: TCP
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- end }}
    - ports:
        - port: {{ .Values.config.server.metrics_port }}
          protocol: TCP
      {{- if .Values.networkPolicy.metricsIngressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.metricsIngressFrom | nindent 8 }}
      {{- end }}
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Kafka broker connections
    - ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
        - port: 9094
          protocol: TCP
      {{- if .Values.networkPolicy.kafkaCIDR }}
      to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kafkaCIDR }}
      {{- end }}
    # Allow Schema Registry connections
    - ports:
        - port: 8081
          protocol: TCP
        - port: 443
          protocol: TCP
    {{- if .Values.networkPolicy.telemetry.enabled }}
    # Allow OTLP trace/metric export.
    - ports:
        {{- range .Values.networkPolicy.telemetry.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- if .Values.networkPolicy.telemetry.cidr }}
      to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.telemetry.cidr }}
      {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.additionalEgress }}
    {{- toYaml .Values.networkPolicy.additionalEgress | nindent 4 }}
    {{- end }}
{{- end }}
