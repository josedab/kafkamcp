{{- if and .Values.existingSecret (not (empty .Values.existingSecret)) }}
{{- /* Use externally managed Secret — nothing to create */ -}}
{{- else if .Values.secrets.create }}
{{- $secretName := printf "%s-credentials" (include "kafkamcp.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafkamcp.fullname" . }}-credentials
  labels:
    {{- include "kafkamcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.agentToken }}
  KAFKAMCP_AGENT_TOKEN: {{ .Values.secrets.agentToken | b64enc | quote }}
  {{- else if and $existing (hasKey $existing.data "KAFKAMCP_AGENT_TOKEN") }}
  KAFKAMCP_AGENT_TOKEN: {{ index $existing.data "KAFKAMCP_AGENT_TOKEN" | quote }}
  {{- else }}
  KAFKAMCP_AGENT_TOKEN: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.approvalSigningKey }}
  KAFKAMCP_APPROVAL_SIGNING_KEY: {{ .Values.secrets.approvalSigningKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.kafkaSaslUsername }}
  KAFKA_SASL_USERNAME: {{ .Values.secrets.kafkaSaslUsername | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.kafkaSaslPassword }}
  KAFKA_SASL_PASSWORD: {{ .Values.secrets.kafkaSaslPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.schemaRegistryUsername }}
  SCHEMA_REGISTRY_USERNAME: {{ .Values.secrets.schemaRegistryUsername | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.schemaRegistryPassword }}
  SCHEMA_REGISTRY_PASSWORD: {{ .Values.secrets.schemaRegistryPassword | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
