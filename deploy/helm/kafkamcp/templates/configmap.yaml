{{- $config := deepCopy .Values.config }}
{{- if .Values.persistence.enabled }}
{{- $persistence := dict "backend" "sqlite" "path" (printf "%s/%s" (trimSuffix "/" .Values.persistence.mountPath) .Values.persistence.filename) }}
{{- $_ := set $config.server "persistence" $persistence }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafkamcp.fullname" . }}-config
  labels:
    {{- include "kafkamcp.labels" . | nindent 4 }}
data:
  kafkamcp.yaml: |
    {{- $config | toYaml | nindent 4 }}
