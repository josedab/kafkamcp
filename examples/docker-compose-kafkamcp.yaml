# KafkaMCP config for Docker Compose environment
server:
  transport: sse
  host: 0.0.0.0
  port: 3100
  log_level: info

clusters:
  - name: local
    bootstrap_servers: "kafka:9092"
    security_protocol: PLAINTEXT
    schema_registry:
      url: "http://schema-registry:8081"
    default: true

schema_cache:
  max_entries: 10000
  ttl_seconds: 300

audit:
  enabled: true
  max_entries: 10000
