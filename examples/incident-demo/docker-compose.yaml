# Incident-Demo: Local Kafka environment for the KafkaMCP triage demo
#
# Starts either Apache Kafka (KRaft, no ZooKeeper) or Redpanda plus a
# Confluent-compatible Schema Registry. Select exactly one profile.
#
# Usage:
#   # Apache Kafka (default):
#   docker compose -f examples/incident-demo/docker-compose.yaml \
#     --profile kafka up -d
#
#   # Redpanda (compatibility profile):
#   docker compose -f examples/incident-demo/docker-compose.yaml \
#     --profile redpanda up -d
#
#   # Wait for readiness, then run the demo:
#   make incident-demo-setup
#   make incident-demo-verify
#   make incident-demo-cleanup
#
# Health-check endpoints:
#   Kafka (KRaft)   : localhost:9092   (TCP)
#   Schema Registry : http://localhost:8081/subjects
#   Redpanda Admin  : http://localhost:9644/v1/cluster  (profile: redpanda)

x-kafka-common: &kafka-common
  restart: unless-stopped

services:

  # ---------------------------------------------------------------------------
  # Apache Kafka — KRaft mode (no ZooKeeper)
  # Enabled only by the explicit 'kafka' profile.
  # ---------------------------------------------------------------------------
  kafka:
    <<: *kafka-common
    image: confluentinc/cp-kafka:7.6.0
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Confluent Schema Registry
  # Shared by both Kafka and Redpanda profiles.
  # ---------------------------------------------------------------------------
  schema-registry:
    <<: *kafka-common
    image: confluentinc/cp-schema-registry:7.6.0
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["kafka"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redpanda — vendor-neutral compatibility profile
  #
  # Activates only when --profile redpanda is passed.
  # Uses the same port (9092) as the default Kafka service; never run both.
  #
  # Redpanda is API-compatible with Kafka but is NOT Apache Kafka.
  # Use this profile to run the compatibility contract tests against Redpanda.
  # ---------------------------------------------------------------------------
  redpanda:
    <<: *kafka-common
    image: redpandadata/redpanda:v24.1.3
    profiles: ["redpanda"]
    ports:
      - "9092:9092"      # Kafka-protocol port
      - "9644:9644"      # Redpanda Admin API
      - "8082:8082"      # Redpanda HTTP Proxy (optional)
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --set
      - redpanda.advertised_kafka_api.address=localhost
      - --set
      - redpanda.advertised_kafka_api.port=9092
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    environment:
      REDPANDA_AUTO_CREATE_TOPICS_ENABLED: "true"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 > /dev/null 2>&1 || curl -sf http://localhost:9644/v1/cluster > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Schema Registry wired to Redpanda (same image, different depends_on)
  schema-registry-redpanda:
    <<: *kafka-common
    image: confluentinc/cp-schema-registry:7.6.0
    profiles: ["redpanda"]
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry-redpanda"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "redpanda:9092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  kafka-data:
    driver: local
  redpanda-data:
    driver: local
