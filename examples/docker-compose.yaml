# Docker Compose: Local Kafka + KafkaMCP development environment
#
# Starts a single-node Kafka broker (KRaft mode, no ZooKeeper), a Confluent
# Schema Registry, and the KafkaMCP MCP server. Use this for local development
# and testing.
#
# Usage:
#   docker compose -f examples/docker-compose.yaml up -d
#   open http://localhost:3100          # KafkaMCP dashboard / SSE endpoint
#   curl http://localhost:3101/livez     # Process liveness
#   curl http://localhost:3101/ready     # Kafka + persistence readiness

services:
  # --- Apache Kafka (KRaft mode, single-node) ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"       # Client listener — connect from host machine or other containers
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # --- Confluent Schema Registry ---
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    ports:
      - "8081:8081"       # Schema Registry HTTP API
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry                    # Hostname used in registration
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092     # Internal broker listener
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081                # Bind to all interfaces inside the container
    depends_on:
      kafka:
        condition: service_healthy

  # --- KafkaMCP MCP Server ---
  kafkamcp:
    build:
      context: ..                       # Build from the repo root (parent of examples/)
      dockerfile: Dockerfile
    ports:
      - "3100:3100"       # MCP SSE endpoint
      - "3101:3101"       # Prometheus metrics and health/readiness probes
    volumes:
      - ./docker-compose-kafkamcp.yaml:/etc/kafkamcp/kafkamcp.yaml  # Mount the KafkaMCP config file
    environment:
      KAFKAMCP_AGENT_TOKEN: ${KAFKAMCP_AGENT_TOKEN:-local-development-agent-token-32-bytes}
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started

volumes:
  kafka-data:             # Named volume for Kafka log segments and metadata
